name: Update packages

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Bump versions and hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/update.sh

      - name: Bump natsumi module sources
        run: ./scripts/update-natsumi.sh

      - name: Check flake (natsumi modules evaluate)
        run: nix flake check --no-build

      - name: Build every package
        run: |
          for f in packages/*.nix; do
            nix build ".#$(basename "$f" .nix)" --no-link --print-build-logs
          done

      - name: Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git push
