name: Cache cpak

# Builds cpak and Serein from nix-config and pushes them to the nix-ext-packages cache. Lix and
# nil are built together by cache-lix.yml and pushed to lix.cachix.org.
#
# Like the other cache workflows it only does real work when something is new: every 15 minutes a
# cheap check (no Nix, a few `git ls-remote` calls) looks at the commits that feed these builds
# (nix-config, nixpkgs and cpak). If that exact set was already built the run ends there.
# Builds use nix-config's committed flake.lock (updating only the private nix-secrets stub), so
# Serein's derivation is the same locked package referenced by the system configuration.
#
# Needs: repo secret CACHIX_AUTH_TOKEN and repo variable CACHIX_CACHE (the nix-ext-packages cache).

on:
  schedule:
    - cron: "8,23,38,53 * * * *"
  push:
    paths:
      - ".github/workflows/cache-misc.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if this exact set of upstream commits was already built"
        type: boolean
        default: false

env:
  CACHIX_CACHE: ${{ vars.CACHIX_CACHE }}

concurrency:
  group: cache-misc
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - name: Look for new commits
        id: revs
        run: |
          set -euo pipefail
          rev() {
            local out
            out=$(git ls-remote "$1" "$2" | head -n1 | cut -f1)
            [[ -n "$out" ]] || { echo "::error::no revision found for $1 $2"; exit 1; }
            echo "$out"
          }
          {
            echo "nix-config $(rev https://github.com/MirzaAyBaig12/nix-config refs/heads/main)"
            echo "nixpkgs $(rev https://github.com/NixOS/nixpkgs refs/heads/nixos-unstable)"
            echo "cpak $(rev https://github.com/Containerpak/cpak refs/heads/v2)"
            echo "workflow $(sha256sum .github/workflows/cache-misc.yml | cut -c1-16)"
          } | tee revs.txt
          hash=$(sha256sum revs.txt | cut -c1-24)
          # a failed attempt is only retried after 6 hours (or when upstream changes / on force)
          bucket=$(( $(date +%s) / 21600 ))
          {
            echo "ok_key=misc-ok-$hash"
            echo "failed_key=misc-failed-$hash-$bucket"
          } >> "$GITHUB_OUTPUT"

      - name: Built already?
        id: built
        uses: actions/cache/restore@v4
        with:
          path: .marker
          key: ${{ steps.revs.outputs.ok_key }}
          lookup-only: true

      - name: Failed recently?
        id: failed
        uses: actions/cache/restore@v4
        with:
          path: .marker
          key: ${{ steps.revs.outputs.failed_key }}
          lookup-only: true

      - name: Decide
        id: decide
        run: |
          if [[ "${{ inputs.force }}" == "true" ]]; then
            go=true; msg="forced"
          elif [[ "${{ steps.built.outputs.cache-hit }}" == "true" ]]; then
            go=false; msg="nothing new, this exact set of commits is already built and cached"
          elif [[ "${{ steps.failed.outputs.cache-hit }}" == "true" ]]; then
            go=false; msg="the last attempt for these commits failed; retrying later (or run with force)"
          else
            go=true; msg="new commits, building"
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          {
            echo "### cpak: $msg"
            echo '```'
            cat revs.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v6
        if: steps.decide.outputs.go == 'true'
        with:
          repository: MirzaAyBaig12/nix-config
          path: nix-config

      - uses: cachix/install-nix-action@v31
        if: steps.decide.outputs.go == 'true'
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://cache.lix.systems
            extra-trusted-public-keys = cache.lix.systems:aBnZUw8zA7H35Cz2RyKFVs3H4PlGTLawyY5KRbvJR8o=

      # Sets the nix-ext-packages cache up as a substituter and pushes everything this job builds.
      - uses: cachix/cachix-action@v16
        if: steps.decide.outputs.go == 'true'
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Fail in seconds if the token can't push to this cache, before spending time on builds.
      - name: Check that we can push to the cache
        if: steps.decide.outputs.go == 'true'
        run: |
          set -euo pipefail
          expr="builtins.toFile \"cachix-access-check-$GITHUB_RUN_ID\" \"$GITHUB_RUN_ID\""
          nix build --impure --no-link --print-out-paths --expr "$expr" | cachix push "$CACHIX_CACHE"

      # nix-config has a private input (nix-secrets, git+ssh) that the runner has no key for,
      # and `nix flake update` would try to fetch it. The cpak build does not need its contents.
      - name: Stub the private nix-secrets input
        if: steps.decide.outputs.go == 'true'
        working-directory: nix-config
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/ci-nix-secrets"
          : > "$GITHUB_WORKSPACE/ci-nix-secrets/ssh.yaml"
          sed -i -E '/nix-secrets = \{/,/\};/ s|url = "[^"]+";|url = "path:'"$GITHUB_WORKSPACE"'/ci-nix-secrets";|' flake.nix
          grep -n -A3 'nix-secrets = {' flake.nix

      - name: Update only the private nix-secrets lock entry
        if: steps.decide.outputs.go == 'true'
        working-directory: nix-config
        run: nix flake update nix-secrets

      - name: Record input revisions
        if: steps.decide.outputs.go == 'true'
        working-directory: nix-config
        run: |
          {
            echo "### Inputs built"
            nix flake metadata --json | jq -r '
              .locks.nodes as $n
              | ["nixpkgs","cpak","serein"][]
              | . as $k
              | "- **\($k)**: `\($n[$k].locked.rev // $n[$k].locked.narHash)`"'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build and cache
        id: build
        if: steps.decide.outputs.go == 'true'
        working-directory: nix-config
        run: |
          set -uo pipefail
          host=Axiom
          failed=()
          echo "::group::cpak"
          if ! nix build ".#nixosConfigurations.$host.config.services.cpak.package" --no-link --print-build-logs --print-out-paths; then
            failed+=(cpak)
          fi
          echo "::endgroup::"

          # Resolve Serein from the actual Axiom system package list, then build that derivation
          # directly. This guarantees the cached store path is the one selected by programs.nix.
          echo "::group::Serein"
          serein_drv=$(nix eval --raw ".#nixosConfigurations.$host.config.environment.systemPackages" --apply '
            packages:
              let matches = builtins.filter (p: builtins.match "[Ss]erein.*" (p.name or "") != null) packages;
              in if builtins.length matches == 1
                 then (builtins.head matches).drvPath
                 else throw "expected exactly one Serein package in Axiom systemPackages, found ${toString (builtins.length matches)}"
          ')
          if ! nix build "$serein_drv" --no-link --print-build-logs --print-out-paths; then
            failed+=(serein)
          fi
          echo "::endgroup::"

          if (( ${#failed[@]} )); then
            echo "::error::failed targets: ${failed[*]}"
            exit 1
          fi

      - name: Remember that this set was built
        if: success() && steps.decide.outputs.go == 'true'
        run: date -u > .marker
      - uses: actions/cache/save@v4
        if: success() && steps.decide.outputs.go == 'true'
        with:
          path: .marker
          key: ${{ steps.revs.outputs.ok_key }}

      - name: Remember that this set failed
        if: failure() && steps.decide.outputs.go == 'true'
        run: date -u > .marker
      - uses: actions/cache/save@v4
        if: failure() && steps.decide.outputs.go == 'true'
        with:
          path: .marker
          key: ${{ steps.revs.outputs.failed_key }}
