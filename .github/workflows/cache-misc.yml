name: Cache cpak

# Builds cpak, Serein and Yapfast from nix-config and pushes them to the nix-ext-packages cache. Lix and
# nil are built together by cache-lix.yml and pushed to lix.cachix.org.
#
# Like the other cache workflows it only does real work when something is new: every 15 minutes a
# cheap check (no Nix, a few `git ls-remote` calls) looks at the commits that feed these builds
# (nix-config, nixpkgs, cpak, Serein and Yapfast). If that exact set was already built the run ends there.
# It builds the exact source revisions and dependencies pinned in nix-config/flake.lock, then
# builds the latest cpak, Serein and Yapfast commits too. Each package flake is built directly;
# the nix-config outputs and NixOS system are never evaluated. nix-config changes are noticed on
# the next scheduled run.
#
# Needs: repo secret CACHIX_AUTH_TOKEN and repo variable CACHIX_CACHE (the nix-ext-packages cache).

on:
  schedule:
    - cron: "8,23,38,53 * * * *"
  push:
    paths:
      - ".github/workflows/cache-misc.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if this exact set of upstream commits was already built"
        type: boolean
        default: false

env:
  CACHIX_CACHE: ${{ vars.CACHIX_CACHE }}

concurrency:
  group: cache-misc
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - name: Look for new commits
        id: revs
        run: |
          set -euo pipefail
          rev() {
            local out
            out=$(git ls-remote "$1" "$2" | head -n1 | cut -f1)
            [[ -n "$out" ]] || { echo "::error::no revision found for $1 $2"; exit 1; }
            echo "$out"
          }
          nix_config_rev=$(rev https://github.com/MirzaAyBaig12/nix-config refs/heads/main)
          nixpkgs_rev=$(rev https://github.com/NixOS/nixpkgs refs/heads/nixos-unstable)
          cpak_rev=$(rev https://github.com/Containerpak/cpak refs/heads/v2)
          serein_rev=$(rev https://github.com/ViceVerse-cz/Serein refs/heads/main)
          yapfast_rev=$(rev https://github.com/yapfast/yapfast refs/heads/main)
          {
            echo "nix-config $nix_config_rev"
            echo "nixpkgs $nixpkgs_rev"
            echo "cpak $cpak_rev"
            echo "serein $serein_rev"
            echo "yapfast $yapfast_rev"
            echo "workflow $(sha256sum .github/workflows/cache-misc.yml | cut -c1-16)"
          } | tee revs.txt
          {
            echo "nix_config_rev=$nix_config_rev"
            echo "nixpkgs_rev=$nixpkgs_rev"
            echo "cpak_rev=$cpak_rev"
            echo "serein_rev=$serein_rev"
            echo "yapfast_rev=$yapfast_rev"
          } >> "$GITHUB_OUTPUT"
          hash=$(sha256sum revs.txt | cut -c1-24)
          # a failed attempt is only retried after 6 hours (or when upstream changes / on force)
          bucket=$(( $(date +%s) / 21600 ))
          {
            echo "ok_key=misc-ok-$hash"
            echo "failed_key=misc-failed-$hash-$bucket"
          } >> "$GITHUB_OUTPUT"

      - name: Built already?
        id: built
        uses: actions/cache/restore@v4
        with:
          path: .marker
          key: ${{ steps.revs.outputs.ok_key }}
          lookup-only: true

      - name: Failed recently?
        id: failed
        uses: actions/cache/restore@v4
        with:
          path: .marker
          key: ${{ steps.revs.outputs.failed_key }}
          lookup-only: true

      - name: Decide
        id: decide
        run: |
          if [[ "${{ inputs.force }}" == "true" ]]; then
            go=true; msg="forced"
          elif [[ "${{ steps.built.outputs.cache-hit }}" == "true" ]]; then
            go=false; msg="nothing new, this exact set of commits is already built and cached"
          elif [[ "${{ steps.failed.outputs.cache-hit }}" == "true" ]]; then
            go=false; msg="the last attempt for these commits failed; retrying later (or run with force)"
          else
            go=true; msg="new commits, building"
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          {
            echo "### cpak: $msg"
            echo '```'
            cat revs.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v6
        if: steps.decide.outputs.go == 'true'
        with:
          repository: MirzaAyBaig12/nix-config
          path: nix-config

      - uses: cachix/install-nix-action@v31
        if: steps.decide.outputs.go == 'true'
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://cache.lix.systems
            extra-trusted-public-keys = cache.lix.systems:aBnZUw8zA7H35Cz2RyKFVs3H4PlGTLawyY5KRbvJR8o=

      # Sets the nix-ext-packages cache up as a substituter and pushes everything this job builds.
      - uses: cachix/cachix-action@v16
        if: steps.decide.outputs.go == 'true'
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Fail in seconds if the token can't push to this cache, before spending time on builds.
      - name: Check that we can push to the cache
        if: steps.decide.outputs.go == 'true'
        run: |
          set -euo pipefail
          expr="builtins.toFile \"cachix-access-check-$GITHUB_RUN_ID\" \"$GITHUB_RUN_ID\""
          nix build --impure --no-link --print-out-paths --expr "$expr" | cachix push "$CACHIX_CACHE"

      - name: Record locked input revisions
        if: steps.decide.outputs.go == 'true'
        working-directory: nix-config
        run: |
          {
            echo "### Locked app inputs"
            jq -r '.nodes as $n | ["cpak","serein","yapfast"][] | . as $k | "- **\($k)**: `\($n[$k].locked.rev)`"' flake.lock
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build and cache
        id: build
        if: steps.decide.outputs.go == 'true'
        working-directory: nix-config
        run: |
          set -euo pipefail

          cpak_rev=$(jq -r '.nodes.cpak.locked.rev' flake.lock)
          cpak_nixpkgs=$(jq -r '.nodes[.nodes.cpak.inputs.nixpkgs].locked.rev' flake.lock)
          serein_rev=$(jq -r '.nodes.serein.locked.rev' flake.lock)
          serein_nixpkgs=$(jq -r '.nodes[.nodes.serein.inputs.nixpkgs].locked.rev' flake.lock)
          serein_flake_parts=$(jq -r '.nodes[.nodes.serein.inputs["flake-parts"]].locked.rev' flake.lock)
          yapfast_rev=$(jq -r '.nodes.yapfast.locked.rev' flake.lock)
          yapfast_nixpkgs=$(jq -r '.nodes[.nodes.yapfast.inputs.nixpkgs].locked.rev' flake.lock)
          yapfast_rust_overlay=$(jq -r '.nodes[.nodes.yapfast.inputs["rust-overlay"]].locked.rev' flake.lock)

          echo "::group::Locked cpak"
          nix build "github:Containerpak/cpak/$cpak_rev#packages.x86_64-linux.cpak" \
            --override-input nixpkgs "github:NixOS/nixpkgs/$cpak_nixpkgs" \
            --no-link --print-build-logs --print-out-paths
          echo "::endgroup::"

          echo "::group::Locked Serein"
          nix build "github:ViceVerse-cz/Serein/$serein_rev#packages.x86_64-linux.default" \
            --override-input nixpkgs "github:NixOS/nixpkgs/$serein_nixpkgs" \
            --override-input flake-parts "github:hercules-ci/flake-parts/$serein_flake_parts" \
            --no-link --print-build-logs --print-out-paths
          echo "::endgroup::"

          echo "::group::Locked Yapfast"
          nix build "github:yapfast/yapfast/$yapfast_rev#packages.x86_64-linux.yapfast" \
            --override-input nixpkgs "github:NixOS/nixpkgs/$yapfast_nixpkgs" \
            --override-input rust-overlay "github:oxalica/rust-overlay/$yapfast_rust_overlay" \
            --no-link --print-build-logs --print-out-paths
          echo "::endgroup::"

          echo "::group::Latest cpak"
          nix build "github:Containerpak/cpak/${{ steps.revs.outputs.cpak_rev }}#packages.x86_64-linux.cpak" \
            --no-link --print-build-logs --print-out-paths
          echo "::endgroup::"

          echo "::group::Latest Serein"
          nix build "github:ViceVerse-cz/Serein/${{ steps.revs.outputs.serein_rev }}#packages.x86_64-linux.default" \
            --no-link --print-build-logs --print-out-paths
          echo "::endgroup::"

          echo "::group::Latest Yapfast"
          nix build "github:yapfast/yapfast/${{ steps.revs.outputs.yapfast_rev }}#packages.x86_64-linux.yapfast" \
            --no-link --print-build-logs --print-out-paths
          echo "::endgroup::"

      - name: Remember that this set was built
        if: success() && steps.decide.outputs.go == 'true'
        run: date -u > .marker
      - uses: actions/cache/save@v4
        if: success() && steps.decide.outputs.go == 'true'
        with:
          path: .marker
          key: ${{ steps.revs.outputs.ok_key }}

      - name: Remember that this set failed
        if: failure() && steps.decide.outputs.go == 'true'
        run: date -u > .marker
      - uses: actions/cache/save@v4
        if: failure() && steps.decide.outputs.go == 'true'
        with:
          path: .marker
          key: ${{ steps.revs.outputs.failed_key }}
