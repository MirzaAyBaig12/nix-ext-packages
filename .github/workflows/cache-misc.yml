name: Cache cpak

# Builds cpak and pushes it to the nix-ext-packages cache. Lix and
# nil are built together by cache-lix.yml and pushed to lix.cachix.org.
#
# Like the other cache workflows it only does real work when something is new: every 15 minutes a
# cheap check (no Nix, a `git ls-remote` call) looks at the latest cpak commit. If that exact revision
# was already built the run ends there. Its package flake is built
# directly from its latest upstream commit; no nix-config checkout, lockfile, or NixOS system is used.
#
# Needs: repo secret CACHIX_AUTH_TOKEN and repo variable CACHIX_CACHE (the nix-ext-packages cache).

on:
  schedule:
    - cron: "8,23,38,53 * * * *"
  push:
    paths:
      - ".github/workflows/cache-misc.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if this exact set of upstream commits was already built"
        type: boolean
        default: false

env:
  CACHIX_CACHE: ${{ vars.CACHIX_CACHE }}

concurrency:
  group: cache-misc
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - name: Look for new commits
        id: revs
        run: |
          set -euo pipefail
          rev() {
            local out
            out=$(git ls-remote "$1" "$2" | head -n1 | cut -f1)
            [[ -n "$out" ]] || { echo "::error::no revision found for $1 $2"; exit 1; }
            echo "$out"
          }
          cpak_rev=$(rev https://github.com/Containerpak/cpak refs/heads/v2)
          {
            echo "cpak $cpak_rev"
            echo "workflow $(sha256sum .github/workflows/cache-misc.yml | cut -c1-16)"
          } | tee revs.txt
          {
            echo "cpak_rev=$cpak_rev"
          } >> "$GITHUB_OUTPUT"
          hash=$(sha256sum revs.txt | cut -c1-24)
          # a failed attempt is only retried after 6 hours (or when upstream changes / on force)
          bucket=$(( $(date +%s) / 21600 ))
          {
            echo "ok_key=misc-ok-$hash"
            echo "failed_key=misc-failed-$hash-$bucket"
          } >> "$GITHUB_OUTPUT"

      - name: Built already?
        id: built
        uses: actions/cache/restore@v4
        with:
          path: .marker
          key: ${{ steps.revs.outputs.ok_key }}
          lookup-only: true

      - name: Failed recently?
        id: failed
        uses: actions/cache/restore@v4
        with:
          path: .marker
          key: ${{ steps.revs.outputs.failed_key }}
          lookup-only: true

      - name: Decide
        id: decide
        run: |
          if [[ "${{ inputs.force }}" == "true" ]]; then
            go=true; msg="forced"
          elif [[ "${{ steps.built.outputs.cache-hit }}" == "true" ]]; then
            go=false; msg="nothing new, this exact set of commits is already built and cached"
          elif [[ "${{ steps.failed.outputs.cache-hit }}" == "true" ]]; then
            go=false; msg="the last attempt for these commits failed; retrying later (or run with force)"
          else
            go=true; msg="new commits, building"
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          {
            echo "### cpak: $msg"
            echo '```'
            cat revs.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: cachix/install-nix-action@v31
        if: steps.decide.outputs.go == 'true'
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://cache.lix.systems
            extra-trusted-public-keys = cache.lix.systems:aBnZUw8zA7H35Cz2RyKFVs3H4PlGTLawyY5KRbvJR8o=

      # Sets the nix-ext-packages cache up as a substituter and pushes everything this job builds.
      - uses: cachix/cachix-action@v16
        if: steps.decide.outputs.go == 'true'
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Fail in seconds if the token can't push to this cache, before spending time on builds.
      - name: Check that we can push to the cache
        if: steps.decide.outputs.go == 'true'
        run: |
          set -euo pipefail
          expr="builtins.toFile \"cachix-access-check-$GITHUB_RUN_ID\" \"$GITHUB_RUN_ID\""
          nix build --impure --no-link --print-out-paths --expr "$expr" | cachix push "$CACHIX_CACHE"

      - name: Build and cache
        id: build
        if: steps.decide.outputs.go == 'true'
        run: |
          set -euo pipefail
          echo "::group::Current cpak"
          nix build "github:Containerpak/cpak/${{ steps.revs.outputs.cpak_rev }}#packages.x86_64-linux.cpak" \
            --no-link --print-build-logs --print-out-paths
          echo "::endgroup::"

      - name: Remember that this set was built
        if: success() && steps.decide.outputs.go == 'true'
        run: date -u > .marker
      - uses: actions/cache/save@v4
        if: success() && steps.decide.outputs.go == 'true'
        with:
          path: .marker
          key: ${{ steps.revs.outputs.ok_key }}

      - name: Remember that this set failed
        if: failure() && steps.decide.outputs.go == 'true'
        run: date -u > .marker
      - uses: actions/cache/save@v4
        if: failure() && steps.decide.outputs.go == 'true'
        with:
          path: .marker
          key: ${{ steps.revs.outputs.failed_key }}
