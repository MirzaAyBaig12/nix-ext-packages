name: Cache Lix

# Builds Lix from its `main` branch (through lix-module's overlay) and pushes it to the public
# lix.cachix.org cache, so `nh os switch` downloads Lix instead of compiling it for ~40 minutes.
# Also builds the other things lix-module's overlay produces: nix-eval-jobs and nix-doc.
#
# It only does real work when something is new: every 15 minutes a cheap check (no Nix, a few
# `git ls-remote` calls) looks for new commits on Lix `main`. nixpkgs and lix-module are part of
# the check too, because they change the derivation (and so the store path) even when Lix itself
# didn't move; without them the cache would miss for anyone who just bumped nixpkgs. If that exact
# set was already built the run ends right there.
#
# The targets are taken from the real nixosConfigurations.Axiom in MirzaAyBaig12/nix-config, so
# the derivations are exactly the ones the laptop asks for. The lock is refreshed first (like
# `nh os switch -u`); the revisions used are listed in each run's summary.
#
# Needs: repo secret CACHIX_AUTH_TOKEN (a token that can push to the `lix` cache). If there is a
# CACHIX_AUTH_TOKEN_LIX secret it is used instead.

on:
  schedule:
    - cron: "2,17,32,47 * * * *"
  push:
    paths:
      - ".github/workflows/cache-lix.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if this exact set of upstream commits was already built"
        type: boolean
        default: false

env:
  # Lix branch to build; forced onto nix-config's `lix` input below, so the CI cache
  # doesn't depend on what branch/tag the pushed nix-config happens to point at.
  LIX_BRANCH: main
  CACHIX_CACHE: lix

concurrency:
  group: cache-lix
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6

      - name: Look for new commits
        id: revs
        run: |
          set -euo pipefail
          rev() {
            local out
            out=$(git ls-remote "$1" "$2" | head -n1 | cut -f1)
            [[ -n "$out" ]] || { echo "::error::no revision found for $1 $2"; exit 1; }
            echo "$out"
          }
          {
            echo "lix ($LIX_BRANCH) $(rev https://git.lix.systems/lix-project/lix "refs/heads/$LIX_BRANCH")"
            echo "lix-module $(rev https://git.lix.systems/lix-project/nixos-module refs/heads/main)"
            echo "nixpkgs $(rev https://github.com/NixOS/nixpkgs refs/heads/nixos-unstable)"
            echo "workflow $(sha256sum .github/workflows/cache-lix.yml | cut -c1-16)"
          } | tee revs.txt
          hash=$(sha256sum revs.txt | cut -c1-24)
          # a failed attempt is only retried after 6 hours (or when upstream changes / on force)
          bucket=$(( $(date +%s) / 21600 ))
          {
            echo "ok_key=lixmain-ok-$hash"
            echo "failed_key=lixmain-failed-$hash-$bucket"
          } >> "$GITHUB_OUTPUT"

      - name: Built already?
        id: built
        uses: actions/cache/restore@v4
        with:
          path: .marker
          key: ${{ steps.revs.outputs.ok_key }}
          lookup-only: true

      - name: Failed recently?
        id: failed
        uses: actions/cache/restore@v4
        with:
          path: .marker
          key: ${{ steps.revs.outputs.failed_key }}
          lookup-only: true

      - name: Decide
        id: decide
        run: |
          if [[ "${{ inputs.force }}" == "true" ]]; then
            go=true; msg="forced"
          elif [[ "${{ steps.built.outputs.cache-hit }}" == "true" ]]; then
            go=false; msg="nothing new, this exact set of commits is already built and cached"
          elif [[ "${{ steps.failed.outputs.cache-hit }}" == "true" ]]; then
            go=false; msg="the last attempt for these commits failed; retrying later (or run with force)"
          else
            go=true; msg="new commits, building"
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          {
            echo "### Lix: $msg"
            echo '```'
            cat revs.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Free disk space
        if: steps.decide.outputs.go == 'true'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v6
        if: steps.decide.outputs.go == 'true'
        with:
          repository: MirzaAyBaig12/nix-config
          path: nix-config

      - uses: cachix/install-nix-action@v31
        if: steps.decide.outputs.go == 'true'
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://cache.lix.systems
            extra-trusted-public-keys = cache.lix.systems:aBnZUw8zA7H35Cz2RyKFVs3H4PlGTLawyY5KRbvJR8o=

      # Sets the lix cache up as a substituter (so unchanged paths are just downloaded) and
      # pushes everything this job builds.
      - uses: cachix/cachix-action@v16
        if: steps.decide.outputs.go == 'true'
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN_LIX || secrets.CACHIX_AUTH_TOKEN }}

      # Fail in seconds, not after a 40 minute Lix build, if the token can't push to this cache.
      - name: Check that we can push to the cache
        if: steps.decide.outputs.go == 'true'
        run: |
          set -euo pipefail
          expr="builtins.toFile \"cachix-access-check-$GITHUB_RUN_ID\" \"$GITHUB_RUN_ID\""
          nix build --impure --no-link --print-out-paths --expr "$expr" | cachix push "$CACHIX_CACHE"

      - name: Point the lix input at the branch
        if: steps.decide.outputs.go == 'true'
        working-directory: nix-config
        run: |
          sed -i -E 's|(lix-project/lix/archive/)[^"]+\.tar\.gz|\1refs/heads/${{ env.LIX_BRANCH }}.tar.gz|' flake.nix
          grep -n 'lix-project/lix/archive' flake.nix

      - name: Update flake.lock (same as `nh os switch -u`)
        if: steps.decide.outputs.go == 'true'
        working-directory: nix-config
        run: nix flake update

      - name: Record input revisions
        if: steps.decide.outputs.go == 'true'
        working-directory: nix-config
        run: |
          {
            echo "### Inputs built"
            nix flake metadata --json | jq -r '
              .locks.nodes as $n
              | ["nixpkgs","lix","lix-module"][]
              | . as $k
              | "- **\($k)**: `\($n[$k].locked.rev // $n[$k].locked.narHash)`"'
          } >> "$GITHUB_STEP_SUMMARY"

      # Lix's test suite sandboxes builds inside the Nix build sandbox. Ubuntu 24.04 runners
      # block unprivileged user namespaces via AppArmor, which fails those tests
      # ("unshare: cannot change root filesystem propagation") after ~30 min of compiling.
      - name: Allow unprivileged user namespaces
        if: steps.decide.outputs.go == 'true'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Fail in a minute, not after a 30 min Lix build, if nested namespaces still don't work.
      - name: Smoke test nested namespaces inside the Nix sandbox
        if: steps.decide.outputs.go == 'true'
        run: |
          nix build --impure --no-link --print-build-logs --expr '
            with import <nixpkgs> { };
            runCommand "userns-smoke-test" { nativeBuildInputs = [ util-linux ]; } "
              unshare --user --map-root-user --mount true
              touch $out
            "'

      - name: Build and cache
        if: steps.decide.outputs.go == 'true'
        working-directory: nix-config
        run: |
          set -uo pipefail
          host=Axiom
          targets=(
            pkgs.lix                # Lix, built by lix-module's overlay
            pkgs.nix-eval-jobs      # lix-module overlay (built from Lix's subproject)
            pkgs.nix-doc            # lix-module overlay (withPlugin = false)
          )
          failed=()
          lix_ok=true
          for t in "${targets[@]}"; do
            # nix-eval-jobs builds against Lix; if Lix itself failed, don't rebuild it for that
            if [[ "$lix_ok" == false && "$t" == pkgs.nix-eval-jobs ]]; then
              echo "::warning::skipping $t (needs Lix, which failed)"
              failed+=("$t")
              continue
            fi
            echo "::group::$t"
            if ! nix build ".#nixosConfigurations.$host.$t" --no-link --print-build-logs --print-out-paths; then
              failed+=("$t")
              [[ "$t" == pkgs.lix ]] && lix_ok=false
            fi
            echo "::endgroup::"
          done
          if (( ${#failed[@]} )); then
            echo "::error::failed targets: ${failed[*]}"
            exit 1
          fi

      - name: Remember that this set was built
        if: success() && steps.decide.outputs.go == 'true'
        run: date -u > .marker
      - uses: actions/cache/save@v4
        if: success() && steps.decide.outputs.go == 'true'
        with:
          path: .marker
          key: ${{ steps.revs.outputs.ok_key }}

      - name: Remember that this set failed
        if: failure() && steps.decide.outputs.go == 'true'
        run: date -u > .marker
      - uses: actions/cache/save@v4
        if: failure() && steps.decide.outputs.go == 'true'
        with:
          path: .marker
          key: ${{ steps.revs.outputs.failed_key }}
